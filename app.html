<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    <script>
      (function() {
        function isIgnored(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.reason || msg.stack || '');
          return str.indexOf('asynchronous response') !== -1 ||
                 str.indexOf('message channel closed') !== -1 ||
                 str.indexOf('chrome-extension') !== -1;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (isIgnored(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isIgnored(e.message || e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
        var origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isIgnored(arguments[i])) return;
          }
          origErr.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isIgnored(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
    {{ HEAD }}
  </head>
  <body {{ BODY_ATTRS }}>
    {{ APP }}
  </body>
</html>
